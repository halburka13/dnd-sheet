<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&amp;D Character Sheet</title>
<meta name="theme-color" content="#221E2D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EFF6; --panel:#FFFFFF; --panel2:#E9E4F1; --ink:#221C2E; --muted:#6B6280;
  --line:#D6CFE2; --hex:#2D7F55; --hexSoft:#D7EFE0; --gold:#8C6A16; --goldSoft:#F3E8C9;
  --blood:#B3364A; --bloodSoft:#F6DCE1; --violet:#5B3FA0;
  --display:"Grenze", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17141F; --panel:#221E2D; --panel2:#2C2639; --ink:#ECE7F4; --muted:#A49BB8; --line:#3A3349;
    --hex:#7BD69A; --hexSoft:#203A2B; --gold:#E2BE62; --goldSoft:#3A3020; --blood:#F07A8C; --bloodSoft:#40212A; --violet:#B39BF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17141F; --panel:#221E2D; --panel2:#2C2639; --ink:#ECE7F4; --muted:#A49BB8; --line:#3A3349;
  --hex:#7BD69A; --hexSoft:#203A2B; --gold:#E2BE62; --goldSoft:#3A3020; --blood:#F07A8C; --bloodSoft:#40212A; --violet:#B39BF0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{max-width:1200px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.who{flex:1 1 260px;min-width:0}
.who h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:.01em}
.who p{margin:2px 0 0;color:var(--muted);font-size:15px}
.vitals{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.vit{background:var(--panel2);border-radius:10px;padding:4px 12px;text-align:center;min-width:64px}
.vit b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.vit span{font-size:12px;color:var(--muted)}
.vit.hp b{color:var(--blood)}
.vit.conc{background:var(--hexSoft)} .vit.conc b{font-size:15px;color:var(--hex);font-family:var(--body);font-weight:700;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rests{display:flex;gap:8px}
nav.tabs{max-width:1200px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 16px 12px;font-family:var(--display);font-size:20px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--hex)}

main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{font-family:var(--display);font-weight:600;font-size:19px;margin:14px 0 6px}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:44px}
.btn.pri{background:var(--hex);border-color:var(--hex);color:var(--panel)}
.btn.dmg{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--panel)}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn.sm{min-height:36px;padding:5px 10px;font-size:15px}
.btn.ghost{background:none}
.x{background:none;border:0;color:var(--muted);font-size:20px;min-width:36px;min-height:36px;border-radius:8px}
.x:hover{color:var(--blood)}
.in{background:var(--panel2);border:1px solid transparent;border-radius:8px;padding:6px 8px;min-height:38px;width:100%}
.in:focus{border-color:var(--violet);outline:none}
.in.num{width:84px;text-align:center}
.in.bare{background:transparent}
.in.bare:hover{background:var(--panel2)}
textarea.in{min-height:120px;resize:vertical}

/* abilities */
.abils{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:620px){.abils{grid-template-columns:repeat(3,1fr)}}
.ab{background:var(--panel2);border-radius:12px;padding:8px 4px;text-align:center}
.ab .k{font-size:13px;color:var(--muted)}
.ab .m{font-family:var(--display);font-size:32px;line-height:1.05}
.ab input{width:56px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;min-height:32px}
.list{display:grid;gap:2px}
.li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px}
.li:nth-child(odd){background:color-mix(in srgb,var(--panel2) 50%,transparent)}
.li .v{font-family:var(--display);font-size:20px;min-width:40px;text-align:right}
.li .n{flex:1}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;padding:0;position:relative}
.dot.on{background:var(--hex);border-color:var(--hex)}
.dot.ex{background:var(--hex);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}

/* hp */
.hpbig{display:flex;align-items:baseline;gap:8px;font-family:var(--display)}
.hpbig .cur{font-size:64px;line-height:1;color:var(--blood)}
.hpbig .max{font-size:26px;color:var(--muted)}
.bar{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--blood);transition:width .3s}
.bar i.t{background:var(--violet)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;min-height:38px;font-size:15px}
.chip.on{background:var(--bloodSoft);border-color:var(--blood);color:var(--blood);font-weight:700}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:34px;height:34px;border-radius:8px;border:2px solid var(--hex);background:var(--hex);padding:0}
.pip.used{background:none;opacity:.55}
.pip.pact{border-color:var(--violet);background:var(--violet)} .pip.pact.used{background:none}
.pip.fail{border-color:var(--blood);background:none} .pip.fail.on{background:var(--blood)}
.pip.succ{background:none} .pip.succ.on{background:var(--hex)}

.atk{display:grid;grid-template-columns:1.4fr 70px 1.2fr 36px;gap:6px;align-items:center;margin-bottom:6px}
.atk .note{grid-column:1/-1;margin-top:-4px}
.feat{border-top:1px solid var(--line);padding:10px 0}
.feat:first-of-type{border-top:0}
.feat .hd{display:flex;align-items:center;gap:8px}
.feat .hd .in{font-weight:700}
.feat .fn{flex:1;min-width:0;font-size:18px}
.feat .fleft{font-size:14px;color:var(--muted);white-space:nowrap}
.feat .fleft.neg{color:var(--blood)}
details.feat summary{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:40px;list-style:none}
details.feat summary::-webkit-details-marker{display:none}
details.feat summary::before{content:"›";font-size:22px;color:var(--muted);width:14px;transition:transform .15s}
details.feat[open] summary::before{transform:rotate(90deg)}
h3+.feat{border-top:0}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.fcard{padding:12px 14px}
.fcard .hd{display:flex;align-items:center;gap:8px}
.fcard .fn{flex:1;min-width:0;font-size:18px}

/* spells */
.casters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.caster{border-radius:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line)}
.caster b{font-family:var(--display);font-size:20px;display:block}
.caster .nums{display:flex;gap:16px;margin-top:4px}
.caster .nums div{font-size:13px;color:var(--muted)} .caster .nums strong{display:block;font-size:22px;color:var(--ink);font-family:var(--display)}
.slotrow{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.slotrow:first-child{border-top:0}
.slotrow .lv{font-family:var(--display);font-size:20px;width:70px}
.sp{display:flex;align-items:center;gap:8px;padding:7px 4px;border-top:1px solid var(--line)}
.sp .nm{flex:1;min-width:0}
.sp .nm .in{font-weight:600}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted);background:none;min-height:28px}
.tag.on{color:var(--violet);border-color:var(--violet)}
.tag.prep{min-width:84px}
.tag.prep.on{color:var(--hex);border-color:var(--hex);background:var(--hexSoft);font-weight:700}
.sp.unprep .nm{opacity:.55}
.src-warlock{border-left:4px solid var(--violet)} .src-wizard{border-left:4px solid var(--hex)} .src-sorcerer{border-left:4px solid var(--gold)}
.lvlhd{font-family:var(--display);font-size:20px;margin:16px 0 2px;color:var(--muted)}

/* kineticist */
.vit.aura{border:0} .vit.aura b{color:var(--muted)}
.vit.aura.on{background:var(--goldSoft)} .vit.aura.on b{color:var(--gold)}
.aurabig{font-family:var(--display);font-size:44px;line-height:1;color:var(--muted)}
.aurabig.on{color:var(--gold)}
.imp{border-top:1px solid var(--line);padding:8px 4px}
.imp .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.imp .hd .nm{flex:1;min-width:150px}
.imp .hd .nm .in{font-weight:600}
.imp .eff{margin:2px 0 0 4px}
.imp details summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.imp .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:6px}
.el-fire{color:var(--blood);border-color:var(--blood)} .el-air{color:var(--violet);border-color:var(--violet)}
.el-earth{color:var(--gold);border-color:var(--gold)} .el-wood,.el-water,.el-metal{color:var(--hex);border-color:var(--hex)}
.ty-Surge,.ty-Complex{color:var(--blood);border-color:var(--blood)} .ty-Stance{color:var(--gold);border-color:var(--gold)}
.imp.stance-on{background:var(--goldSoft);border-radius:8px}

/* turn tracker */
.slots{display:grid;grid-template-columns:repeat(3,1fr) 1.6fr;gap:8px}
@media (max-width:700px){.slots{grid-template-columns:repeat(3,1fr)}.slot.move{grid-column:1/-1}}
.slot{background:var(--hexSoft);border:2px solid var(--hex);border-radius:12px;padding:8px;text-align:center;min-height:64px}
.slot b{display:block;font-family:var(--display);font-size:24px;line-height:1.1;color:var(--hex)}
.slot span{font-size:13px;color:var(--muted)}
.slot.used{background:none;border-color:var(--line)} .slot.used b{color:var(--muted)}
.slot.move{background:var(--panel2);border-color:var(--line)} .slot.move b{color:var(--ink)}
.atkleft{margin:10px 0 0;padding:8px 12px;border-radius:10px;background:var(--goldSoft);color:var(--gold)}
.opts{display:grid;gap:14px;grid-template-columns:2fr 1fr 1fr;margin-top:6px}
@media (max-width:900px){.opts{grid-template-columns:1fr}}
.opts h3{margin:10px 0 4px}
.obtns{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.btn.imp-ov{border-color:var(--blood)}
#rollbox{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:55;width:min(420px,92vw);background:var(--panel);border:2px solid var(--violet);border-radius:16px;padding:10px 14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.rb-hd{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:20px} .rb-hd strong{flex:1}
.rb-line{display:grid;grid-template-columns:110px 70px 1fr;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.rb-line b{font-family:var(--display);font-size:30px;line-height:1.1;text-align:center}
.rb-lbl{font-size:14px;color:var(--muted)} .rb-sub{font-size:13px;color:var(--muted)}
.rb-line.crit b{color:var(--gold)} .rb-line.miss b{color:var(--blood)}
.rb-ask{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)} .rb-ask span{flex:1;font-weight:700}
.rb-ask .btn{min-width:84px;text-align:center}
.riders{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.rider{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border-radius:10px;background:var(--bloodSoft);color:var(--blood);font-size:15px}
.rb-note{font-size:14px;color:var(--gold);border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.rb-foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:4px}
button.v.rollv{background:none;border:1px solid var(--line);border-radius:8px;min-height:36px;min-width:52px;font-family:var(--display);font-size:20px}
.ab .m.rollv{background:none;border:0;width:100%;cursor:pointer}
.kinbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:var(--panel2);border:2px solid var(--line)}
.kinbar.on{background:var(--goldSoft);border-color:var(--gold)}
.kb-state{min-width:130px} .kb-state b{display:block;font-family:var(--display);font-size:22px;line-height:1.1} .kb-state span{font-size:13px;color:var(--muted)}
.kinbar.on .kb-state b{color:var(--gold)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.vit.turnvit{border:0;background:var(--hexSoft)} .vit.turnvit b{color:var(--hex);font-size:18px}

/* coins/town */
.coins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.coin{text-align:center;background:var(--panel2);border-radius:12px;padding:8px}
.coin .k{font-size:13px;color:var(--muted)} .coin input{width:100%;text-align:center;font-family:var(--display);font-size:22px;background:transparent;border:0;padding:0}
.coin.gp{background:var(--goldSoft)}
.treasury{font-family:var(--display);font-size:56px;line-height:1;color:var(--gold)}
.money{display:grid;grid-template-columns:1fr 110px 36px;gap:6px;align-items:center;margin-bottom:6px}
.net{font-family:var(--display);font-size:24px}
.pos{color:var(--hex)} .neg{color:var(--blood)}
.log{max-height:360px;overflow:auto}
.log div{padding:6px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.log div:first-child{border-top:0}
.log .t{color:var(--muted);font-size:14px;min-width:56px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat{background:var(--panel2);border-radius:12px;padding:8px}
.stat .row{flex-wrap:nowrap}
.stat .val{font-family:var(--display);font-size:28px;text-align:center;flex:1}
.proj{display:grid;grid-template-columns:1fr 100px 120px 36px;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:560px){.proj{grid-template-columns:1fr 90px 36px}.proj .stsel{grid-column:1/3}}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,6,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:85vh;overflow:auto;border:1px solid var(--line)}
.modal h2{font-family:var(--display);margin:0 0 8px;font-size:26px}
.modal .btn{width:100%;margin-top:8px;text-align:left}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.syncpill{border:1px solid var(--gold);background:var(--goldSoft);color:var(--gold);border-radius:999px;padding:6px 14px;min-height:38px;font-weight:700;font-size:14px}
.syncpill[hidden]{display:none}
.savestate{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<script src="./config.js"></script>
<script src="./supabase.js"></script>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="who" data-a="chars" role="button" tabindex="0" title="Switch character" style="cursor:pointer"><h1 id="hName"></h1><p id="hSub"></p></div>
    <div class="vitals" id="vitals"></div>
    <button id="syncPill" class="syncpill" data-a="resync" hidden></button>
    <button id="updPill" class="syncpill" data-a="reloadApp" hidden>New version ready · tap to update</button>
    <div class="rests">
      <button class="btn" data-a="chars">Characters</button>
      <button class="btn" data-a="shortRest">Short rest</button>
      <button class="btn" data-a="longRest">Long rest</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="rollbox" role="status" aria-live="polite" hidden></div>
<div id="modalRoot"></div>

<script>
"use strict";
const SKILLS=[["acrobatics","Acrobatics","dex"],["animal","Animal Handling","wis"],["arcana","Arcana","int"],["athletics","Athletics","str"],["deception","Deception","cha"],["history","History","int"],["insight","Insight","wis"],["intimidation","Intimidation","cha"],["investigation","Investigation","int"],["medicine","Medicine","wis"],["nature","Nature","int"],["perception","Perception","wis"],["performance","Performance","cha"],["persuasion","Persuasion","cha"],["religion","Religion","int"],["sleight","Sleight of Hand","dex"],["stealth","Stealth","dex"],["survival","Survival","wis"]];
const ABILS=[["str","Strength"],["dex","Dexterity"],["con","Constitution"],["int","Intelligence"],["wis","Wisdom"],["cha","Charisma"]];
const CONDS=["Blinded","Charmed","Deafened","Frightened","Grappled","Incapacitated","Invisible","Paralyzed","Petrified","Poisoned","Prone","Restrained","Stunned","Unconscious"];
const ORD=["Cantrips","1st","2nd","3rd","4th","5th","6th","7th","8th","9th"];

const PREP_DEFAULT=new Set(["Shield","Catapult","Detect Magic","Invisibility","Darkvision","Locate Object","Fireball","Spirit Shroud","Dispel Magic","Slow"]);
function sp(name,lvl,src,r,c){return {name,lvl,src,r:!!r,c:!!c,prep:src!=="wizard"||lvl===0||PREP_DEFAULT.has(name),note:""}}
const DEFAULT={
  v:3, updatedAt:0,
  name:"Galesh Nesta", race:"Changeling", classes:"Warlock 3 (Hexblade) / Wizard 6", background:"Custom", alignment:"Chaotic",
  prof:3, wizLevel:6,
  abil:{str:5,dex:16,con:16,int:18,wis:16,cha:20},
  saves:{con:1,int:1,wis:1},
  skills:{acrobatics:1,deception:1,history:1,intimidation:1,investigation:1,performance:1,persuasion:1},
  hp:{max:75,cur:19,temp:0}, ac:16, shield:false, speed:30, initMisc:0,
  conc:"", death:{s:0,f:0},
  hd:[{die:8,total:3,used:0},{die:6,total:6,used:0}],
  conditions:[], exhaustion:0,
  attacks:[
    {name:"Greatsword (pact weapon)",bonus:"+8",dmg:"2d6+5 slashing",note:"Hex Warrior: attacks with Charisma. Two-handed, heavy."},
    {name:"Eldritch Blast",bonus:"+8",dmg:"1d10+5 force ×2 beams",note:"120 ft. Agonizing Blast adds Cha to each beam. Roll each beam separately."},
    {name:"Booming Blade",bonus:"+8",dmg:"weapon +1d8 thunder",note:"If the target willingly moves before your next turn: 2d8 thunder."},
    {name:"Green-Flame Blade",bonus:"+8",dmg:"weapon +1d8 fire",note:"Another creature within 5 ft takes 1d8+4 fire (wizard cantrip, Int)."}

/* Damage roll for an impulse, with its save DC */
function rollImpulse(x){
  const dm=rollDamage(x.dmg); if(!dm) return;
  let sub=dm.txt, extra="";
  if(x.type==="Basic"&&gatherPending()){ const g=rollDamage(S.kin.gather); if(g){ dm.total+=g.total; sub+=` + Gather Power ${g.txt}`; extra=" Empowered: this overflows your aura."; } S.combat.gather=false; }
  const sv=(String(x.dmg).match(/\b(Str|Dex|Con|Int|Wis|Cha)\w*\s+save/i)||[])[1];
  const lines=[{label:"Damage",big:String(dm.total),sub}];
  if(sv) lines.unshift({label:"Save",big:`DC ${kinStats().dc}`,sub:`${sv} save${/half/i.test(x.dmg)?", half on a success":""}`});
  showRoll(x.name,lines,x.dmg+extra);
}
/* ---------- spell damage ----------
   spell.dmg = damage at its own level ("8d6 fire", "1d10+5 force ×2 beams", "+1d8 thunder")
   spell.up  = extra per slot level above ("1d6", or a number like "5")
   spell.hit = "attack" (spell attack) | "save" | "weapon" (melee weapon attack + dmg) | "auto" (just damage)
   spell.save = save ability for "save" */
const HIT_TYPES=[["attack","Spell attack roll"],["save","Saving throw"],["weapon","Melee weapon attack + this damage"],["auto","Just roll the damage"]];
function scaleDice(up,n){ const m=String(up||"").trim().match(/^(\d*)d(\d+)(.*)$/i); if(m) return `${(Number(m[1]||1))*n}d${m[2]}${m[3]||""}`; const f=parseInt(up,10); return isNaN(f)?"":`+${f*n}`; }
function spellDmgAt(s,slot){ let d=s.dmg||""; const above=slot&&slot>s.lvl?slot-s.lvl:0; if(above&&s.up){ const extra=scaleDice(s.up,above); if(extra) d+=extra.startsWith("+")?extra:` + ${extra}`; } return d; }
function spellLabel(s){ if(!s.dmg) return ""; const h=s.hit||"auto"; return `${s.dmg}${s.up?` (+${s.up}/slot level)`:""}${h==="save"?` · ${s.save||"Dex"} save`:h==="attack"?" · spell attack":h==="weapon"?" · with a melee weapon attack":""}`; }
function rollSpell(s,slot){
  if(!s||!s.dmg) return;
  const src=S.sources[s.src]?casterStats(s.src):{dc:8+S.prof,atk:S.prof};
  const d=spellDmgAt(s,slot), h=s.hit||"auto", title=slot&&slot>s.lvl?`${s.name} (${ORD[slot]} level)`:s.name;
  if(h==="attack"){ rollAttack({name:title,bonus:sgn(src.atk),dmg:d}); return; }
  if(h==="weapon"){ const w=meleeWeapon(); rollAttack({name:title,bonus:w?w.bonus:sgn(src.atk),dmg:"weapon "+d}); return; }
  const dm=rollDamage(d); if(!dm){ toast(`${s.name}: ${d}`); return; }
  const lines=[{label:"Damage",big:String(dm.total),sub:dm.txt}];
  if(h==="save") lines.unshift({label:"Save",big:`DC ${src.dc}`,sub:`${s.save||"Dex"} save`});
  showRoll(title,lines,d);
}
function spellDmgModal(i){
  const s=S.spells[i];
  modal(`<h2>${esc(s.name)} damage</h2>
    <label class="small muted">Damage at ${s.lvl?ORD[s.lvl]+" level":"your current level"}<input class="in" id="sdDmg" value="${esc(s.dmg||"")}" placeholder="e.g. 8d6 fire, or 1d10+5 force ×2 beams" style="margin:2px 0 8px;color:var(--ink)"></label>
    ${s.lvl?`<label class="small muted">Extra for each slot level above ${ORD[s.lvl]}<input class="in" id="sdUp" value="${esc(s.up||"")}" placeholder="e.g. 1d6 (leave empty if none)" style="margin:2px 0 8px;color:var(--ink)"></label>`:`<p class="muted small">Cantrips: write the damage for your current level (it grows at levels 5, 11 and 17).</p>`}
    <label class="small muted">How it hits<select class="in" id="sdHit" style="margin:2px 0 8px">${HIT_TYPES.map(([v,l])=>`<option value="${v}" ${(s.hit||"auto")===v?"selected":""}>${l}</option>`).join("")}</select></label>
    <label class="small muted">Save (if it uses one)<select class="in" id="sdSave" style="margin:2px 0 8px">${["Str","Dex","Con","Int","Wis","Cha"].map(a=>`<option ${(s.save||"Dex")===a?"selected":""}>${a}</option>`).join("")}</select></label>
    <button class="btn pri" data-a="spDmgSave" data-i="${i}" style="text-align:center">Save</button>
    ${s.dmg?`<button class="btn" data-a="spDmgClear" data-i="${i}" style="text-align:center">No damage</button>`:""}`);
}
function checkMod(kind,k){
  if(kind==="abil") return mod(S.abil[k]);
  if(kind==="save") return mod(S.abil[k])+(S.saves[k]?S.prof:0);
  const sk=SKILLS.find(s=>s[0]===k); return mod(S.abil[sk[2]])+S.prof*(S.skills[k]||0);
}
function rollCheck(kind,k){
  const m=checkMod(kind,k), r=d20();
  const name=kind==="skill"?SKILLS.find(s=>s[0]===k)[1]:(ABILS.find(a=>a[0]===k)[1]+(kind==="save"?" save":" check"));
  showRoll(name,[{label:kind==="save"?"Saving throw":"Check",big:String(r.n+m),sub:`d20 ${r.txt} ${sgn(m)}${r.n===20?" · natural 20":r.n===1?" · natural 1":""}`,cls:r.n===20?"crit":r.n===1?"miss":""}]);
}

/* Spells tab is hidden for a kineticist with no spells; Impulses tab only shows for kineticists */
function tabList(){
  const t=[["combat","Combat"]];
  if(S&&S.kin) t.push(["impulses","Impulses"]);
  t.push(["features","Features"]);
  if(!S||!S.kin||S.spells.length||Object.keys(S.sources).length) t.push(["spells","Spells"]);
  t.push(["character","Character"],["inventory","Inventory"],["town","Town"],["notes","Notes"],["sync","Sync"]);
  return t;
}

/* ---------- combat ---------- */
/* ---------- turn tracker (action economy) ---------- */
// Casting times for common spells that aren't an action. Anything not listed counts as an action.
const CAST_TIME={"hex":"bonus","misty step":"bonus","spiritual weapon":"bonus","healing word":"bonus","shillelagh":"bonus","wrathful smite":"bonus","searing smite":"bonus","thunderous smite":"bonus","branding smite":"bonus","blinding smite":"bonus","staggering smite":"bonus","hunter’s mark":"bonus","hunter's mark":"bonus","spirit shroud":"bonus","expeditious retreat":"bonus","sanctuary":"bonus","magic weapon":"bonus","flame blade":"bonus","shadow blade":"bonus","shield":"reaction","counterspell":"reaction","hellish rebuke":"reaction","absorb elements":"reaction","feather fall":"reaction","silvery barbs":"reaction"};
const SLOT_NAME={action:"action",bonus:"bonus action",reaction:"reaction"};
// Common actions anyone can take: [slot, name, short rule]. "attack" = replaces one attack of the Attack action.
const STD_ACTIONS=[
  ["action","Dash","Extra movement equal to your speed this turn."],
  ["action","Dodge","Until your next turn, attacks against you have disadvantage and you have advantage on Dex saves."],
  ["action","Disengage","Your movement doesn’t provoke opportunity attacks this turn."],
  ["action","Help","An ally gets advantage on their next check, or on their next attack against a creature within 5 ft of you."],
  ["action","Hide","Make a Dex (Stealth) check while out of sight."],
  ["action","Ready","Pick a trigger and an action; take it with your reaction when the trigger happens."],
  ["action","Search","Make a Wis (Perception) or Int (Investigation) check."],
  ["action","Use an object","Use something that needs your action, like a second object interaction."],
  ["action","Drink a potion","Drinking or giving someone a potion takes your action."],
  ["action","Stabilize","DC 10 Wis (Medicine) check on a creature at 0 HP."],
  ["action","Escape a grapple","Str (Athletics) or Dex (Acrobatics) against the grappler’s Athletics."],
  ["attack","Grapple","Uses one attack. Your Athletics against their Athletics or Acrobatics; on a win their speed is 0."],
  ["attack","Shove","Uses one attack. Your Athletics against their Athletics or Acrobatics; knock them prone or push them 5 ft."],
  ["bonus","Off-hand attack","After attacking with a light melee weapon, attack with a light weapon in your other hand. No ability modifier on its damage unless it’s negative."],
  ["reaction","Opportunity attack","One melee attack against a creature that leaves your reach."],
  ["reaction","Readied action","Take the action you readied when its trigger happens."],
  ["free","Object interaction","One free per turn: draw or stow a weapon, open a door, pick something up."],
  ["free","Drop prone","Costs no movement."],
  ["move","Stand up","Costs half your speed."],
  ["free","Speak","A few words, no cost."]];
const stdOf=slot=>STD_ACTIONS.map((x,j)=>({slot:x[0],n:x[1],d:x[2],j})).filter(x=>slot.includes(x.slot));
function inCombat(){return !!(S&&S.combat&&S.combat.on)}
function castTime(name){return CAST_TIME[String(name||"").toLowerCase()]||"action"}
/* Attacks per Attack action: kineticist blasts use Extra Blast (kin.blast.count); weapons use an Extra Attack feature. */
function isBlast(a){return !!(S.kin&&/blast/i.test(a?.name||""))}
function attacksPer(a){ if(isBlast(a)) return Math.max(1,Number(S.kin.blast.count)||1); return S.features.some(f=>/^extra attack/i.test(f.name))?2:1 }
function attackKind(a){return isBlast(a)?"blast":"weapon"}
function impTime(x){const a=String(x.act||"").toLowerCase(); if(x.type==="Complex"||/action \+ bonus/.test(a)) return ["action","bonus"]; if(/reaction/.test(a)) return ["reaction"]; if(/bonus/.test(a)) return ["bonus"]; if(/^action/.test(a)) return ["action"]; return []}
/* Marks a slot used during combat. Warns (doesn't block) if it was already spent. */
let spendWarn="", spentTwice=[], forceNext=false, pendingEl=null;
/* Which slots a tracker button needs right now (empty = free, or it uses a leftover Extra Attack swing) */
function costOf(a,k,i){
  const c=S&&S.combat; if(!c) return [];
  const cantrip=sp=>{ const ct=castTime(sp.name); if(ct==="action"&&c.atk>0&&c.atkKind==="weapon"&&!c.cantripSwap&&!S.kin) return []; return [ct]; };
  switch(a){
    case "tAttack": { const at=S.attacks[i]; if(!at) return []; return c.atk>0&&c.atkKind===attackKind(at)?[]:["action"]; }
    case "tCast": { const sp=S.spells[i]; if(!sp) return []; return sp.lvl===0?cantrip(sp):[castTime(sp.name)]; }
    case "castCantripBtn": return S.spells[i]?cantrip(S.spells[i]):[];
    case "cast": return S.spells[i]?[castTime(S.spells[i].name)]:[];
    case "impUse": { const x=S.kin&&S.kin.impulses[i]; return x?impTime(x):[]; }
    case "tStd": { const st=STD_ACTIONS[i]; if(!st) return []; if(st[0]==="attack") return c.atk>0&&c.atkKind==="weapon"?[]:["action"]; return ["action","bonus","reaction"].includes(st[0])?[st[0]]:[]; }
    case "tGather": case "tBonusAtk": case "tChannel": return ["bonus"];
    case "tFeat": return k?[k]:[];
    case "aura": return S.kin&&!S.kin.aura?["bonus"]:[];
    case "bladesong": return !S.bladesong?["bonus"]:[];
  }
  return [];
} // warning shown in front of the next toast
function spend(kind){
  if(!inCombat()) return;
  const c=S.combat;
  if(c[kind]&&!forceNext&&!spentTwice.includes(SLOT_NAME[kind])){ spentTwice.push(SLOT_NAME[kind]); spendWarn=`Already used your ${spentTwice.join(" and ")} this turn! `; }
  c[kind]=true;
}
/* Cantrip during combat. With Extra Attack (Bladesinger), ONE 1-action cantrip per Attack action can take the place of an attack. */
function castCantrip(i){
  const s=S.spells[i], c=S.combat, ct=castTime(s.name);
  if(ct==="action"&&c.atk>0&&c.atkKind==="weapon"&&!c.cantripSwap&&!S.kin){
    c.atk--; c.cantripSwap=true; save(); render(); rollSpell(s,0);
    toast(`${s.name} in place of an attack.${c.atk?` ${c.atk} more weapon attack${c.atk>1?"s":""} this turn.`:""}`,4500); return; }
  const actionWasFree=!c.action;
  spend(ct);
  if(ct==="action"&&actionWasFree&&!S.kin&&S.features.some(f=>/^extra attack/i.test(f.name))){ c.atk=attacksPer()-1; c.atkKind="weapon"; c.cantripSwap=true; }
  save(); render(); rollSpell(s,0);
  toast(`Cast ${s.name}.${c.atk?` You can still make ${c.atk} weapon attack${c.atk>1?"s":""} (Extra Attack). Only one cantrip per Attack action.`:""}`,4500);
}
/* Kineticist: aura + stance in one tap during combat */
function kinBar(){
  const k=S.kin, c=S.combat, locked=c.auraLock===c.round;
  const stances=k.impulses.map((x,i)=>({x,i})).filter(o=>o.x.type==="Stance");
  return `<div class="kinbar ${k.aura?"on":""}">
    <div class="kb-state"><b>Aura ${k.aura?"on":"off"}</b><span>${k.aura?(k.stance?esc(k.stance):"No stance"):locked?"Overflowed: back next turn":"Bonus action to channel"}</span></div>
    <div class="obtns" style="margin:0;flex:1">
      ${k.aura?stances.map(o=>`<button class="btn sm ${k.stance===o.x.name?"gold":""}" data-a="tStance" data-i="${o.i}">${esc(o.x.name)}</button>`).join("")+`<button class="btn sm ghost" data-a="aura">Dismiss</button>`
        :stances.map(o=>`<button class="btn gold" data-a="tChannel" data-i="${o.i}" ${locked?"disabled":""}>Channel: ${esc(o.x.name)}</button>`).join("")+`<button class="btn" data-a="tChannel" data-i="-1" ${locked?"disabled":""}>Channel, no stance</button>`}
    </div></div>`;
}
function rollModeChips(){ const m=rollMode(); return `<div class="chips" style="margin-bottom:10px">${[["normal","Normal roll"],["adv","Advantage"],["dis","Disadvantage"]].map(([k,l])=>`<button class="chip ${m===k?"on":""}" style="${m===k?"background:var(--hexSoft);color:var(--hex);border-color:var(--hex)":""}" data-a="rollMode" data-k="${k}">${l}</button>`).join("")}</div>`; }
function startCombat(){
  S.combat={on:true,round:1,action:false,bonus:false,reaction:false,move:speedNow(),atk:0};
  const im=mod(S.abil.dex)+Number(S.initMisc||0), r=d20(); S.combat.init=r.n+im;
  save(); render();
  showRoll("Initiative",[{label:"Initiative",big:String(r.n+im),sub:`d20 ${r.txt} ${sgn(im)}`,cls:r.n===20?"crit":r.n===1?"miss":""}],"Tell your GM, then tap Next turn at the start of each of your turns.");
}
function nextTurn(){ const c=S.combat; c.round++; c.action=c.bonus=c.reaction=false; c.atk=0; c.gather=false; c.cantripSwap=false; c.move=speedNow(); save(); render(); toast(`Round ${c.round}: action, bonus action, reaction and movement are back.`); }

    S.features.some(f=>/crossbow expert/i.test(f.name))?opt("tBonusAtk","Crossbow Expert: hand crossbow shot"):"",

        ${ready.some(s=>s.lvl>0&&castTime(s.name)==="action")?`<div class="muted small">Spells</div><div class="obtns">${spellBtns("action",1)}</div>`:""}

/* ---------- impulses (kineticist homebrew) ---------- */
const IMP_TYPES=["Stance","Basic","Surge","Complex"];
const IMP_TYPE_HELP={Stance:"Passive while the aura is on. One stance at a time.",Basic:"Aura stays on.",Surge:"Overflow: the aura goes out.",Complex:"Action + bonus action. Overflow: the aura goes out."};
function kinStats(){const k=S.kin;const cm=mod(S.abil[k.abil||"con"]),bm=mod(S.abil[k.blastAbil||"dex"]);return {dc:8+S.prof+cm,atk:S.prof+cm,batk:S.prof+bm,bm}}
function elClass(el){return "el-"+String(el||"").toLowerCase().split(/[^a-z]/)[0]}
function renderImpulses(){
  const k=S.kin, st=kinStats();
  const stances=k.impulses.filter(x=>x.type==="Stance");
  const byLvl={}; k.impulses.forEach((x,i)=>{(byLvl[x.lvl]??=[]).push({...x,i})});

  return `
  <div class="casters">
    <div class="caster src-sorcerer"><b>Impulses</b><div class="nums"><div><strong>${st.dc}</strong>Save DC</div><div><strong>${sgn(st.atk)}</strong>Attack</div><div><strong>${(k.abil||"con").toUpperCase()}</strong>Ability</div></div></div>
    <div class="caster src-warlock"><b>Elemental blast</b><div class="nums"><div><strong>${sgn(st.batk)}</strong>To hit</div><div><strong>${esc(k.blast.dice)}${sgn(st.bm)}</strong>Damage</div><div><strong>×${Number(k.blast.count)||1}</strong>Per action</div></div></div>
    <div class="caster src-wizard"><b>Impulse level</b><div class="nums"><div><strong>${ORD[Number(k.ilvl)||1]}</strong>Manifest at</div><div><strong>+${esc(k.gather)}</strong>Gather Power</div></div></div>
  </div>
  <div class="grid">
    <section class="card">
      <h2>Kinetic aura</h2>
      <div class="row" style="gap:16px">
        <span class="aurabig ${k.aura?"on":""}">${k.aura?"On":"Off"}</span>
        <button class="btn ${k.aura?"":"gold"}" data-a="aura">${k.aura?"Dismiss aura":"Channel elements (bonus action)"}</button>
      </div>
      <p class="muted small">${esc(k.auraNote)}</p>
      <label class="small muted">Stance <select class="in" data-b="kin.stance" style="margin-top:2px">
        <option value="" ${k.stance?"":"selected"}>No stance</option>
        ${stances.map(x=>`<option ${k.stance===x.name?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
      ${k.stance&&!k.aura?`<p class="small" style="color:var(--gold)">${esc(k.stance)} works again once you channel your aura.</p>`:""}
      ${buf?`<p class="small muted">Internal Buffer: ${buf.max-buf.used}/${buf.max} left (keeps the aura on after an overflow).</p>`:""}
    </section>
    <section class="card">
      <h2>Elemental blast</h2>
      <p style="margin-top:0"><strong>${sgn(st.batk)} to hit, ${esc(k.blast.dice)}${sgn(st.bm)}</strong>, ${Number(k.blast.count)||1} attacks per action. Needs the aura and a free hand.</p>
      <label class="small muted">Range and damage types<input class="in" data-b="kin.blast.range" value="${esc(k.blast.range)}" style="margin:2px 0 8px;color:var(--ink)"></label>
      <div class="row small muted">
        <label>Die <input class="in num" data-b="kin.blast.dice" value="${esc(k.blast.dice)}" style="width:70px"></label>
        <label>Attacks <input class="in num" type="number" min="1" max="4" data-b="kin.blast.count" value="${k.blast.count}" style="width:56px"></label>
        <label>Gather Power <input class="in num" data-b="kin.gather" value="${esc(k.gather)}" style="width:70px"></label>
        <label>Impulse level <input class="in num" type="number" min="1" max="9" data-b="kin.ilvl" value="${k.ilvl}" style="width:56px"></label>
      </div>
      <p class="muted small">Gather Power: bonus action if you haven’t moved or acted this turn. Speed 0 until your next turn, and your first blast (or Basic impulse) this turn adds the dice. Empowering a Basic impulse overflows.</p>
    </section>
  </div>
  <section class="card" style="margin-top:16px">
    <h2>Impulses <button class="btn sm" data-a="add" data-k="kin.impulses">Add impulse</button></h2>
    <div class="chips small" style="margin-bottom:4px">${IMP_TYPES.map(t=>`<span class="tag ty-${t}" style="min-height:0">${t}: ${IMP_TYPE_HELP[t]}</span>`).join("")}</div>
    ${Object.keys(byLvl).sort((a,b)=>a-b).map(l=>`<div class="lvlhd">${ORD[l]||l} level</div>
      ${byLvl[l].map(x=>`<div class="imp ${x.type==="Stance"&&k.stance===x.name&&k.aura?"stance-on":""}">
        <div class="hd">
          <div class="nm"><input class="in bare" data-b="kin.impulses.${x.i}.name" value="${esc(x.name)}" aria-label="Impulse name"></div>

            <label>Type<select class="in" data-b="kin.impulses.${x.i}.type">${IMP_TYPES.map(t=>`<option ${x.type===t?"selected":""}>${t}</option>`).join("")}</select></label>

            <label>Range / area<input class="in" data-b="kin.impulses.${x.i}.range" value="${esc(x.range)}"></label>

          </div>

        </details>
      </div>`).join("")}`).join("")||`<p class="muted">No impulses yet. Add your first one.</p>`}
    <p class="muted small" style="margin-top:12px">Impulses aren’t spells and use no slots. They do count as spells for Counterspell, Dispel Magic and Detect Magic. You need a free hand. Overflow puts your aura out until the start of your next turn.</p>
  </section>`;
}
function impUseModal(i){
  const x=S.kin.impulses[i], k=S.kin;
  if(x.type==="Stance"){ k.stance=k.stance===x.name?"":x.name; save(); render(); toast(k.stance?(k.aura?`${x.name} is your stance now.`:`${x.name} is set. It works once you channel your aura.`):"No stance."); return; }
  if(x.type==="Basic"){ useImpulse(i,"keep"); return; }
  const buf=S.features.find(f=>/internal buffer/i.test(f.name));
  const bufLeft=buf?buf.max-buf.used:0;
  modal(`<h2>${esc(x.name)}</h2><p class="muted">${x.type==="Complex"?"Takes your action and bonus action. ":""}This impulse overflows: ${k.aura?"your aura goes out until the start of your next turn.":"your aura is already off."}${k.aura&&/cyclonic/i.test(k.stance)?" <strong>Cyclonic Ascent ends with it, so you start to fall.</strong>":""}</p>
    ${x.dmg?`<p><strong>${esc(x.dmg)}</strong></p>`:""}
    <button class="btn dmg" data-a="impConfirm" data-i="${i}" data-k="out" style="text-align:center">Use it${k.aura?" (aura goes out)":""}</button>
    ${k.aura&&bufLeft>0?`<button class="btn gold" data-a="impConfirm" data-i="${i}" data-k="buffer" style="text-align:center">Use Internal Buffer: aura stays on (${bufLeft} left)</button>`:""}`);
}
function useImpulse(i,how){
  const x=S.kin.impulses[i], k=S.kin;
  if(how==="buffer"){ const buf=S.features.find(f=>/internal buffer/i.test(f.name)); if(buf) buf.used=Math.min(buf.max,buf.used+1); }
  const wasFlying=k.aura&&/cyclonic/i.test(k.stance);
  if(how==="out"){ if(k.aura&&inCombat()) S.combat.auraLock=S.combat.round; k.aura=false; }
  impTime(x).forEach(t=>spend(t));
  if(x.c) S.conc=x.name;
  save(); render();
  toast(`${x.name}${x.dmg?": "+x.dmg:""}.${how==="out"&&wasFlying?" You’re falling: use Air Cushion or take the fall.":how==="out"?" Aura is out until your next turn.":""}`,4000);
  rollImpulse(x);
}

  <section class="card">
    <h2>Town stats <button class="btn sm" data-a="add" data-k="town.stats">Add stat</button></h2>
    ${T.stats.length?`<div class="stats">${T.stats.map((s,i)=>`<div class="stat">
      <div class="row" style="flex-wrap:nowrap"><input class="in bare small" data-b="town.stats.${i}.name" value="${esc(s.name)}"><button class="x" data-a="del" data-k="town.stats" data-i="${i}" aria-label="Remove">×</button></div>
      <div class="row"><button class="btn sm" data-a="statAdj" data-i="${i}" data-k="-1" aria-label="Decrease">−</button><span class="val">${fmt(s.val)}</span><button class="btn sm" data-a="statAdj" data-i="${i}" data-k="1" aria-label="Increase">+</button></div>

  <section class="card">
    <h2>Buildings &amp; projects <button class="btn sm" data-a="add" data-k="town.projects">Add</button></h2>

      <input class="in" data-b="town.projects.${i}.name" value="${esc(p.name)}" aria-label="Project" style="font-weight:600">
      <input class="in" type="number" data-b="town.projects.${i}.cost" value="${p.cost}" placeholder="Cost" aria-label="Cost gp" style="text-align:right">
      <select class="in stsel" data-b="town.projects.${i}.status">${["Planned","Building","Done"].map(o=>`<option ${p.status===o?"selected":""}>${o}</option>`).join("")}</select>

    <div class="row" style="margin-top:10px"><input id="logNote" class="in" placeholder="Note an event, e.g. “Bandit raid on the east farms”" style="flex:1"><button class="btn" data-a="logNote">Add to chronicle</button></div>

/* ---------- modal ---------- */
function modal(html){document.getElementById("modalRoot").innerHTML=`<div class="scrim" data-a="closeModal"><div class="modal" role="dialog" aria-modal="true">${html}<button class="btn ghost" data-a="closeModal" style="text-align:center">Cancel</button></div></div>`}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}

/* ---------- actions ---------- */
function doRest(kind){
  if(kind==="short"){
    S.pact.used=0;
    S.features.forEach(f=>{if(f.reset==="short")f.used=0});
    const dice=S.hd.map((h,i)=>({...h,i})).filter(h=>h.total-h.used>0);
    modal(`<h2>Short rest</h2><p class="muted">Pact slots and short-rest features are back. Spend hit dice to heal (adds your Con modifier ${sgn(mod(S.abil.con))}).</p>
      <p><strong>HP ${S.hp.cur} / ${S.hp.max}</strong></p>
      ${dice.length?dice.map(h=>`<button class="btn pri" data-a="spendHD" data-i="${h.i}">Roll a d${h.die} (${h.total-h.used} left)</button>`).join(""):`<p class="muted">No hit dice left.</p>`}
      <button class="btn" data-a="closeModal" style="text-align:center">Done</button>`);
  } else {
    S.hp.cur=S.hp.max; S.hp.temp=0; S.death={s:0,f:0}; S.pact.used=0;
    Object.values(S.slots).forEach(s=>s.used=0);
    S.features.forEach(f=>{if(f.reset!=="none")f.used=0});
    let regain=Math.max(1,Math.floor(totalLevel()/2));
    S.hd.slice().sort((a,b)=>b.die-a.die).forEach(h=>{const r=Math.min(h.used,regain);h.used-=r;regain-=r});
    if(S.exhaustion>0)S.exhaustion--;
    S.conc=""; S.shield=false; S.bladesong=false; S.riders=[]; if(S.combat) S.combat.on=false; if(S.kin) S.kin.aura=false;
    toast("Long rest done: HP, slots and features restored. You can change prepared spells and use Cantrip Formulas now.",4500);
  }
  save(); render();
}

function castModal(i){
  const s=S.spells[i];
  const opts=[];
  if(!isReady(s)){ modal(`<h2>Cast ${esc(s.name)}</h2><p class="muted">Not prepared. Wizards can still cast ritual spells from their spellbook.</p>${s.r&&hasSpellbook(s)?`<button class="btn" data-a="castAt" data-i="${i}" data-k="ritual">As a ritual (+10 minutes, no slot)</button>`:""}`); return; }
  for(let l=s.lvl;l<=9;l++){const sl=S.slots[l];if(sl.max-sl.used>0)opts.push(`<button class="btn" data-a="castAt" data-i="${i}" data-k="${l}">${ORD[l]}-level slot <span class="muted">(${sl.max-sl.used} left)</span></button>`)}
  if(S.pact.level>=s.lvl&&S.pact.max-S.pact.used>0)opts.push(`<button class="btn" data-a="castAt" data-i="${i}" data-k="pact" style="border-color:var(--violet)">Pact slot, ${ORD[S.pact.level]} level <span class="muted">(${S.pact.max-S.pact.used} left)</span></button>`);
  if(s.r)opts.push(`<button class="btn" data-a="castAt" data-i="${i}" data-k="ritual">As a ritual (+10 minutes, no slot)</button>`);
  modal(`<h2>Cast ${esc(s.name)}</h2>${s.c?`<p class="muted small">Concentration${S.conc?` – this ends ${esc(S.conc)}`:""}</p>`:""}${opts.length?opts.join(""):`<p>No slots of ${ORD[s.lvl]} level or higher left.</p>`}`);
}

function addTownLog(text,amt){T.log.push({turn:T.turn,text,amt:amt||0}); if(T.log.length>300)T.log.shift()}

document.addEventListener("click",e=>{
  // Tapping anywhere outside the roll card closes it (a new roll opens a fresh one)
  const rb=document.getElementById("rollbox"); if(rb&&!rb.hidden&&!rb.contains(e.target)&&Date.now()-rollShownAt>300) rb.hidden=true;
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, k=el.dataset.k, i=Number(el.dataset.i), j=Number(el.dataset.j);
  if(a==="closeModal"){ if(e.target!==el) return; closeModal(); render(); return; }
  if(a==="forceRedo"){ const p=pendingEl; closeModal(); if(p&&document.body.contains(p)){ forceNext=true; try{ p.click(); } finally { forceNext=false; } } return; }
  // In combat, stop actions whose action / bonus action / reaction is already used (with a "do it anyway" for GM extras)
  if(!forceNext&&inCombat()){ const need=costOf(a,k,i), used=need.filter(x=>S.combat[x]);
    if(used.length){ pendingEl=el; modal(`<h2>Already used</h2><p>You already used your ${used.map(x=>SLOT_NAME[x]).join(" and ")} this turn${a==="tCast"||a==="castCantripBtn"?". With Extra Attack, only one cantrip can replace an attack":""}.</p><p class="muted small">Tap Next turn when your new turn starts. Use “Do it anyway” only if something gives you an extra one (like Action Surge or Haste).</p><button class="btn" data-a="forceRedo" style="text-align:center">Do it anyway</button>`); return; } }
  switch(a){
    case "tab": tab=k; render(); window.scrollTo(0,0); return;
    case "shortRest": doRest("short"); return;
    case "longRest": modal(`<h2>Take a long rest?</h2><p class="muted">Restores HP, all spell slots and features, half your hit dice, and ends concentration.</p><button class="btn pri" data-a="confirmLong" style="text-align:center">Take long rest</button>`); return;
    case "confirmLong": closeModal(); doRest("long"); return;
    case "spendHD": { const h=S.hd[i]; if(h.total-h.used<=0) return; const r=roll(h.die), heal=Math.max(0,r+mod(S.abil.con)); h.used++; S.hp.cur=Math.min(S.hp.max,S.hp.cur+heal); save(); doRest("short"); toast(`Rolled ${r} on the d${h.die}: healed ${heal}.`); return; }
    case "hp": {
      const inp=document.getElementById("hpAmt"); const n=Math.max(0,Math.floor(Number(inp.value)||0)); if(!n&&k!=="temp"){inp.focus();return;}
      if(k==="dmg"){ let d=n; const t=Math.min(S.hp.temp,d); S.hp.temp-=t; d-=t; S.hp.cur=Math.max(0,S.hp.cur-d);
        if(S.conc) toast(`Concentration check: Con save DC ${Math.max(10,Math.floor(n/2))} to keep ${S.conc}.${S.bladesong?` Bladesong adds +${bsBonus()}.`:""}`,4500);
        if(S.hp.cur===0) toast("You’re down. Death saves are showing.",3500); }
      else if(k==="heal"){ if(S.hp.cur===0)S.death={s:0,f:0}; S.hp.cur=Math.min(S.hp.max,S.hp.cur+n); }
      else S.hp.temp=n;
      save(); render(); return; }
    case "death": { const cur=S.death[k]; S.death[k]=cur>i?i:i+1; save(); render(); return; }
    case "toggleShield": S.shield=!S.shield; save(); render(); return;
    case "aura": { if(!S||!S.kin) return; const k=S.kin; const fly=k.aura&&/cyclonic/i.test(k.stance); k.aura=!k.aura; if(k.aura){ spend("bonus"); if(inCombat()&&S.combat.auraLock===S.combat.round) spendWarn+="Your aura overflowed this round, so normally it can’t come back until your next turn. "; } save(); render();
      toast(k.aura?(k.stance?`Aura on. Stance: ${k.stance}.`:"Aura on. No stance picked."):fly?"Aura off. Cyclonic Ascent ends, so you fall unless something holds you up.":"Aura off."); return; }
    case "bladesong": { const f=bsFeature(); if(!f) return;
      if(S.bladesong){ S.bladesong=false; if(inCombat()) S.combat.move=Math.max(0,S.combat.move-10); save(); render(); toast("Bladesong ended."); return; }
      if(f.max>0&&f.used>=f.max){ toast("No Bladesong uses left. They come back after a long rest.",3500); return; }
      if(inCombat()) S.combat.move+=10;
      if(f.max>0) f.used++; S.bladesong=true; spend("bonus"); save(); render();
      toast(`Bladesong (1 minute): AC +${bsBonus()}, speed +10 ft, advantage on Acrobatics, +${bsBonus()} on concentration saves. Ends with medium or heavy armor, a shield, or a two-handed attack.`,6000); return; }
    case "combatStart": startCombat(); return;
    case "rollMode": S.rollMode=k; save(); render(); return;
    case "spDmg": spellDmgModal(i); return;
    case "spDmgSave": { const sp=S.spells[i]; sp.dmg=document.getElementById("sdDmg").value.trim(); const up=document.getElementById("sdUp"); sp.up=up?up.value.trim():""; sp.hit=document.getElementById("sdHit").value; sp.save=document.getElementById("sdSave").value; if(!sp.dmg){ delete sp.dmg; delete sp.up; } closeModal(); save(); render(); toast("Damage saved."); return; }
    case "spDmgClear": { const sp=S.spells[i]; delete sp.dmg; delete sp.up; closeModal(); save(); render(); return; }
    case "castCantripBtn": if(inCombat()) castCantrip(i); else rollSpell(S.spells[i],0); return;
    case "rollClose": document.getElementById("rollbox").hidden=true; return;
    case "atkHit": atkResolve(i,true); return;
    case "atkMiss": atkResolve(i,false); return;
    case "riderDrop": S.riders.splice(i,1); save(); render(); return;
    case "rollCheck": { const [kind,key]=k.split(":"); rollCheck(kind,key); return; }
    case "deathRoll": { const r=roll(20); let res;
      if(r===20){ S.hp.cur=1; S.death={s:0,f:0}; res="Natural 20: you’re back with 1 HP!"; }
      else if(r===1){ S.death.f=Math.min(3,S.death.f+2); res="Natural 1: two failures."; }
      else if(r>=10){ S.death.s=Math.min(3,S.death.s+1); res=S.death.s>=3?"Third success: you’re stable.":"Success."; }
      else { S.death.f=Math.min(3,S.death.f+1); res="Failure."; }
      if(S.death.f>=3) res+=" Three failures: you die.";
      save(); render(); showRoll("Death save",[{label:"d20",big:String(r),sub:res,cls:r===20?"crit":r<10?"miss":""}]); return; }
    case "tChannel": { const k=S.kin; k.stance=i>=0?k.impulses[i].name:""; k.aura=true; spend("bonus"); save(); render(); toast(`Aura on${k.stance?`, ${k.stance}`:""}.`); return; }
    case "tStance": { const k=S.kin; k.stance=k.impulses[i].name; save(); render(); toast(`Stance: ${k.stance}.`); return; }
    case "combatNext": nextTurn(); return;
    case "combatEnd": S.combat.on=false; save(); render(); toast("Combat ended."); return;
    case "slotToggle": S.combat[k]=!S.combat[k]; save(); render(); return;
    case "tMove": { const c=S.combat; c.move=k==="reset"?speedNow():Math.max(0,c.move-Number(k)); save(); render(); return; }
    case "tAttack": { const a=S.attacks[i];
      // An attack line that is really a cantrip on the sheet (Eldritch Blast, Booming Blade...) follows cantrip rules
      if(!inCombat()){ rollAttack(a); return; }
      const c=S.combat, kind=attackKind(a);
      if(c.atk>0&&c.atkKind===kind) c.atk--; else { spend("action"); c.atk=attacksPer(a)-1; c.atkKind=kind; c.cantripSwap=false; }
      save(); render(); rollAttack(a); if(c.atk||spendWarn) toast(c.atk?`${c.atk} more attack${c.atk>1?"s":""} this turn.`:"",3500); return; }
    case "tCast": { const s=S.spells[i];
      if(s.lvl===0){ castCantrip(i); return; }
      castModal(i); return; }
    case "tStd": { const [slot,n,d]=STD_ACTIONS[i];
      if(!inCombat()){ toast(`${n}: ${d}`,5000); return; }
      const c=S.combat;
      if(slot==="attack"){ if(c.atk>0&&c.atkKind==="weapon") c.atk--; else { spend("action"); c.atk=attacksPer()-1; c.atkKind="weapon"; } }
      else if(slot==="action"||slot==="bonus"||slot==="reaction") spend(slot);

function importBackup(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{
    const o=JSON.parse(r.result); let ch,tw;
    if(TOWN_ONLY){ const town=o&&(o.town||(o.format===undefined&&o.treasury!==undefined?o:null)); if(!town) throw 0;
      const tid=newId(); const t=fillTown(town); t.updatedAt=Date.now(); TW[tid]=t; lastJ["t"+tid]=docJ(t); persistDoc("t",tid); setMeta("t",tid,{rev:null,base:null,pending:true,owner:uid}); activeT=tid;
      activate(); persistIds(); render(); sync(); toast(`Loaded ${t.name||"town"} as a new town.`); return; }
    if(o&&o.format==="dnd-sheet-backup-2"){ ch=o.character; tw=o.town; }
    else if(o&&o.abil){ const m=migrate(merge(clone(DEFAULT),o)); tw=m.town; ch=m; }
    else throw 0;
    const id=newId(); const d=fillChar(ch); d.archived=false; d.updatedAt=Date.now();
    CH[id]=d; lastJ["c"+id]=docJ(d); persistDoc("c",id); setMeta("c",id,{rev:null,base:null,pending:true,owner:uid}); activeC=id;
    if(tw){ const tid=newId(); const t=fillTown(tw); t.updatedAt=Date.now(); TW[tid]=t; lastJ["t"+tid]=docJ(t); persistDoc("t",tid); setMeta("t",tid,{rev:null,base:null,pending:true,owner:uid}); activeT=tid; }
    activate(); persistIds(); render(); sync(); toast(`Loaded ${d.name||"character"} as a new character.`);
  }catch(e){ toast("That file isn’t a backup from this sheet."); } };
  r.readAsText(file);
}

/* One-time move of the town app's old private town copies (dndtown-*) into the shared store. Keeps the newer copy. */
function moveOldTownCopies(){
  const old=LS.get("dndtown-ids",null); if(!old||!(old.t||[]).length) return [];
  const moved=[];
  old.t.forEach(id=>{
    const od=LS.get(`dndtown-t:${id}`,null), om=LS.get(`dndtown-meta-t:${id}`,null);
    if(od){ const cur=LS.get(docKey("t",id),null);
      if(!cur||(od.updatedAt||0)>(cur.updatedAt||0)){ LS.set(docKey("t",id),od); if(om) setMeta("t",id,om); }
      moved.push(id); }
    LS.del(`dndtown-t:${id}`); LS.del(`dndtown-meta-t:${id}`);
  });
  LS.set("dndtown-ids",{c:old.c||[],t:[]});
  return moved;
}
function loadTownIds(){
  const moved=moveOldTownCopies();
  const shared=LS.get(TOWN_IDS,null)||(LS.get(NS+"-ids",{}).t)||[];
  return [...new Set([...shared,...moved])];
}

window.addEventListener("storage",e=>{

  let changed=false;
  if(e.key===TOWN_IDS){
    const ids=LS.get(TOWN_IDS,[]);
    ids.forEach(id=>{ if(!TW[id]){ const d=LS.get(docKey("t",id),null); if(d){ TW[id]=fillTown(d); lastJ["t"+id]=docJ(TW[id]); changed=true; } } });
    Object.keys(TW).forEach(id=>{ if(!ids.includes(id)){ delete TW[id]; changed=true; } });
  } else if(e.key.startsWith(TNS+"-t:")){
    const id=e.key.slice((TNS+"-t:").length);
    if(e.newValue===null){ if(TW[id]){ delete TW[id]; changed=true; } }
    else { try{ const d=fillTown(JSON.parse(e.newValue)); if(docJ(d)!==lastJ["t"+id]){ TW[id]=d; lastJ["t"+id]=docJ(d); changed=true; } }catch(err){} }
  }
  if(!changed) return;
  if(!activeT||!TW[activeT]){ const t=Object.keys(TW); activeT=t.length?t[0]:null; }

function attachTown(){ if(S) Object.defineProperty(S,"town",{get:()=>T,enumerable:false,configurable:true}); }
function activate(){
  S=activeC&&CH[activeC]?CH[activeC]:null;
  T=activeT&&TW[activeT]?TW[activeT]:null;
  attachTown();
}
function liveChars(){return Object.entries(CH).filter(([,d])=>!d.archived)}
function pickActive(){
  if(!activeC||!CH[activeC]||CH[activeC].archived){ const l=liveChars(); activeC=l.length?l[0][0]:null; }
  if(!activeT||!TW[activeT]){ const t=Object.keys(TW); activeT=t.length?t[0]:null; }
  activate(); persistIds();
}
function bootLocal(){
  const ids=LS.get(NS+"-ids",null);
  if(ids){
    (ids.c||[]).forEach(id=>{const d=LS.get(docKey("c",id),null); if(d){CH[id]=fillChar(d); lastJ["c"+id]=docJ(CH[id]);}});
    const a=LS.get(NS+"-active",{}); activeC=a.c; activeT=a.t;
  } else {
    // upgrade from the single-sheet version
    const raw=TOWN_ONLY?null:LS.get("dnd-sheet-v1",null);
    if(raw){
      const old=migrate(merge(clone(DEFAULT),raw));
      const sess=LS.get("dnd-sync-auth",null);
      const u=sess&&(sess.user&&sess.user.id||sess.currentSession&&sess.currentSession.user&&sess.currentSession.user.id);
      const cid=u||newId(), tid=u||newId();
      const town=fillTown(Object.assign(clone(old.town||{}),{updatedAt:old.updatedAt||0}));
      delete old.town;
      CH[cid]=fillChar(old); TW[tid]=town;
      lastJ["c"+cid]=docJ(CH[cid]); lastJ["t"+tid]=docJ(TW[tid]);
      persistDoc("c",cid); persistDoc("t",tid);
      setMeta("c",cid,{rev:null,base:null,pending:true,owner:u||null});
      setMeta("t",tid,{rev:null,base:null,pending:true,owner:u||null});
      activeC=cid; activeT=tid;
      if(u) LS.set(NS+"-account",u);
    }
  }
  loadTownIds().forEach(id=>{ if(TW[id]) return; const d=LS.get(docKey("t",id),null); if(d){TW[id]=fillTown(d); lastJ["t"+id]=docJ(TW[id]);} });
  pickActive();
}

function wipeLocal(){
  Object.keys(CH).forEach(id=>{LS.del(docKey("c",id));LS.del(metaKey("c",id));delete CH[id];});
  Object.keys(TW).forEach(id=>{LS.del(docKey("t",id));LS.del(metaKey("t",id));delete TW[id];});
  activeC=activeT=null; activate(); persistIds();
}
/* save: stamps whichever open document actually changed */
let saveTimer=null;
function save(){
  [["c",activeC,S],["t",activeT,T]].forEach(([k,id,doc])=>{
    if(!doc||!id) return;
    const j=docJ(doc);
    if(lastJ[k+id]!==j){ lastJ[k+id]=j; doc.updatedAt=Date.now(); persistDoc(k,id); const m=getMeta(k,id); m.pending=true; setMeta(k,id,m); }
  });
  if(syncing) syncAgain=true;
  paintSaveState();
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>sync(),1500);
}
function anyPending(){ return [...Object.keys(CH).map(id=>getMeta("c",id)),...Object.keys(TW).map(id=>getMeta("t",id))].some(m=>m.pending); }

/* ---------- three-way merge ---------- */
const isObj=x=>x!==null&&typeof x==="object"&&!Array.isArray(x);
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const SUM_PATHS=/^(town\.treasury|coins\.(cp|sp|ep|gp|pp))$/;
function merge3(b,l,r,localNewer,path){
  if(l===undefined) return clone(r);
  if(r===undefined) return clone(l);
  if(same(l,r)) return clone(l);
  if(isObj(l)&&isObj(r)){
    const out={};
    for(const k of new Set([...Object.keys(l),...Object.keys(r)])) out[k]=merge3(isObj(b)?b[k]:undefined,l[k],r[k],localNewer,path?path+"."+k:k);
    return out;
  }
  if(same(b,l)) return clone(r);
  if(same(b,r)) return clone(l);
  if(SUM_PATHS.test(path)&&typeof l==="number"&&typeof r==="number"&&typeof b==="number") return b+(l-b)+(r-b);
  if(path==="town.log"&&Array.isArray(l)&&Array.isArray(r)){
    const seen=new Set(r.map(x=>JSON.stringify(x))); const out=clone(r);
    l.forEach(x=>{const s=JSON.stringify(x); if(!seen.has(s)){seen.add(s); out.push(clone(x));}});
    return out;
  }
  return clone(localNewer?l:r);
}

/* ---------- cloud sync (Supabase) ---------- */
const CFG=Object.assign({url:"",key:""},window.SYNC_CONFIG||{});
try{const o=JSON.parse(localStorage.getItem("dnd-sync-config")||"null"); if(o&&o.url&&o.key){CFG.url=o.url;CFG.key=o.key;}}catch(e){}
let sb=null, session=null, syncing=false, syncAgain=false, needsRender=false, installEvt=null, authErr="", syncErr="", firstSyncDone=false;
let lastSynced=LS.get(NS+"-sync-time",0);
const members={}; // townId -> [{user_id, role}]
const OFFLINE_MSG="Offline: changes are saved on this device and will sync when you’re back online.";
const timeout=ms=>new Promise((_,rej)=>setTimeout(()=>rej(new Error("The server took too long to answer")),ms));
const withTimeout=(p,ms=12000)=>Promise.race([p,timeout(ms)]);

function initClient(){
  if(sb||!CFG.url||!CFG.key||!window.supabase) return;
  try{
    // Both apps share one sign-in. supabase-js coordinates pages that use the same storageKey (locks + BroadcastChannel).
    try{ if(!localStorage.getItem("dnd-sync-auth")&&localStorage.getItem("dndtown-auth")) localStorage.setItem("dnd-sync-auth",localStorage.getItem("dndtown-auth")); localStorage.removeItem("dndtown-auth"); }catch(e){}
    sb=supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"dnd-sync-auth"}});
    sb.auth.getSession().then(({data})=>{session=data.session; uid=session?.user?.id||null; render(); paintSaveState();});
    sb.auth.onAuthStateChange((ev,s)=>{ session=s; uid=s?.user?.id||null; paintSaveState(); if(ev==="SIGNED_IN") setTimeout(()=>sync(),0); if(tab==="sync") render(); });
  }catch(e){ sb=null; syncErr="The project URL or key looks wrong."; }
}

async function signIn(){
  const email=document.getElementById("authEmail").value.trim(), password=document.getElementById("authPass").value;
  if(!email||!password){ toast("Enter your email and password."); return; }
  if(!navigator.onLine){ toast("You need internet to sign in the first time."); return; }
  initClient(); if(!sb){ toast("Sync isn’t set up yet."); return; }
  authErr="";
  try{ const {data,error}=await withTimeout(sb.auth.signInWithPassword({email,password})); if(error) throw error; session=data.session; uid=session.user.id; toast("Signed in. Syncing…"); }
  catch(e){ authErr=e.message||"Sign-in failed."; }
  render();
}

function adoptDoc(k,id,merged,snapshot){
  const docs=k==="c"?CH:TW, fill=k==="c"?fillChar:fillTown;
  const cur=docs[id];
  let next;
  if(cur&&snapshot&&docJ(cur)!==docJ(snapshot)){ next=fill(merge3(snapshot,cur,merged,true,ROOT[k])); next.updatedAt=Date.now(); const m=getMeta(k,id); m.pending=true; setMeta(k,id,m); }
  else next=fill(merged);
  docs[id]=next; lastJ[k+id]=docJ(next); persistDoc(k,id);
}

async function syncKind(k,rows){
  const docs=k==="c"?CH:TW, fill=k==="c"?fillChar:fillTown, table=TABLE[k];
  const remote={}; rows.forEach(r=>remote[r.id]=r);
  const ids=new Set([...Object.keys(docs),...Object.keys(remote)]);
  for(const id of ids){
    const local=docs[id], row=remote[id], meta=getMeta(k,id);
    if(!local){ // new from the cloud
      docs[id]=fill(row.data); lastJ[k+id]=docJ(docs[id]); persistDoc(k,id);
      setMeta(k,id,{rev:row.rev,base:clone(docs[id]),pending:false,owner:row.owner}); continue;
    }
    if(!row){
      if(k==="t"&&meta.rev!==null&&meta.owner&&meta.owner!==uid){ // access to a shared town was removed
        delete docs[id]; LS.del(docKey(k,id)); LS.del(metaKey(k,id)); continue;
      }
      const snapshot=clone(local);
      const ins={id,data:snapshot,rev:1,name:snapshot.name||""}; if(k==="c") ins.archived=!!snapshot.archived;
      const {error}=await withTimeout(sb.from(table).insert(ins));
      if(error){ if(error.code==="23505") { syncAgain=true; continue; } throw error; }
      setMeta(k,id,{rev:1,base:snapshot,pending:docJ(docs[id])!==docJ(snapshot),owner:uid}); continue;
    }
    if(!meta.pending&&meta.rev===row.rev) continue;
    const snapshot=clone(local);
    const rdata=fill(row.data);
    let merged;
    if(!meta.base||meta.rev===null) merged=(snapshot.updatedAt||0)>(rdata.updatedAt||0)?clone(snapshot):rdata;
    else merged=merge3(meta.base,snapshot,rdata,(snapshot.updatedAt||0)>=(rdata.updatedAt||0),ROOT[k]);
    merged.updatedAt=Math.max(snapshot.updatedAt||0,rdata.updatedAt||0);
    if(same(merged,rdata)){
      setMeta(k,id,{rev:row.rev,base:clone(merged),pending:false,owner:row.owner}); adoptDoc(k,id,merged,snapshot); continue;
    }
    const upd={data:merged,rev:row.rev+1,name:merged.name||""}; if(k==="c") upd.archived=!!merged.archived;
    const {data:res,error}=await withTimeout(sb.from(table).update(upd).eq("id",id).eq("rev",row.rev).select("rev"));
    if(error){ if(k==="t"&&(error.code==="42501"||error.code==="PGRST301")){ setMeta(k,id,{...meta,rev:row.rev}); docs[id]=rdata; persistDoc(k,id); continue; } throw error; }
    if(!res||!res.length){ // no permission (viewer) or someone saved at the same moment
      if(k==="t"&&row.owner!==uid&&townRole(id)==="viewer"){ setMeta(k,id,{rev:row.rev,base:clone(rdata),pending:false,owner:row.owner}); adoptDoc(k,id,rdata,null); }
      else syncAgain=true;
      continue;
    }
    setMeta(k,id,{rev:row.rev+1,base:clone(merged),pending:false,owner:row.owner}); adoptDoc(k,id,merged,snapshot);
  }
}

async function loadMembers(){
  if(!sb||!uid) return;
  const {data,error}=await withTimeout(sb.from("town_members").select("town_id,user_id,role"));
  if(error) return;
  Object.keys(members).forEach(k=>delete members[k]);
  (data||[]).forEach(m=>{(members[m.town_id]??=[]).push(m)});
}
function townOwner(id){return getMeta("t",id).owner}
function townRole(id){ if(!uid) return "owner"; const o=townOwner(id); if(!o||o===uid) return "owner"; const m=(members[id]||[]).find(x=>x.user_id===uid); return m?m.role:"viewer"; }

async function sync(manual){
  if(!sb||!CFG.url){ paintSaveState(); return; }
  if(!navigator.onLine){ paintSaveState(); if(manual) toast("Still offline."); return; }
  if(syncing){ syncAgain=true; return; }
  let s; try{ s=(await sb.auth.getSession()).data.session; }catch(e){ s=null; }
  session=s; uid=s?.user?.id||null; if(!s){ paintSaveState(); return; }
  const acct=LS.get(NS+"-account",null);
  if(acct&&acct!==uid) wipeLocal();
  LS.set(NS+"-account",uid);
  syncing=true; syncAgain=false; syncErr=""; paintSaveState();
  try{
    await loadMembers();
    if(!TOWN_ONLY){
      const {data:cr,error:ce}=await withTimeout(sb.from("characters").select("id,owner,data,rev"));
      if(ce) throw ce;
      await syncKind("c",cr||[]);
    }
    const {data:tr,error:te}=await withTimeout(sb.from("towns").select("id,owner,data,rev"));
    if(te) throw te;
    await syncKind("t",tr||[]);
    const wasC=activeC, wasT=activeT;
    pickActive();
    lastSynced=Date.now(); LS.set(NS+"-sync-time",lastSynced); firstSyncDone=true;
    const a=document.activeElement;
    if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest("main")&&wasC===activeC&&wasT===activeT){ needsRender=true; renderHeader(); } else render();
    if(manual) toast("Synced.");
  }catch(e){
    syncErr=navigator.onLine?(e.message||"Sync failed."):"";
    if(manual&&syncErr) toast("Sync failed: "+syncErr,4000);
  }finally{
    syncing=false; paintSaveState();
    if(syncAgain){ syncAgain=false; setTimeout(()=>sync(),800); }
  }
}

async function check(){
  if(!sb||!navigator.onLine||document.hidden||syncing) return;
  let s; try{ s=(await sb.auth.getSession()).data.session; }catch(e){ return; }
  if(!s) return;
  if(anyPending()) return sync();
  try{
    const [{data:c},{data:t}]=await Promise.all([TOWN_ONLY?Promise.resolve({data:[]}):sb.from("characters").select("id,rev"),sb.from("towns").select("id,rev")]);
    const changed=(rows,k,docs)=>(rows||[]).some(r=>getMeta(k,r.id).rev!==r.rev)||(rows||[]).length!==Object.keys(docs).length;
    if(changed(c,"c",CH)||changed(t,"t",TW)) sync();
  }catch(e){}
}

function syncLabel(){
  if(!CFG.url||!CFG.key) return {pill:"",text:"Sync isn’t set up. Your data is saved on this device only."};
  if(!session) return {pill:"",text:"Signed out. Your data is saved on this device only."};
  if(!navigator.onLine) return {pill:"Offline: saving on this device",text:OFFLINE_MSG};
  if(syncing) return {pill:"",text:"Syncing…"};
  if(syncErr) return {pill:"Not synced: tap to retry",text:"Last sync failed: "+syncErr};
  if(anyPending()) return {pill:"",text:"Waiting to sync…"};
  return {pill:"",text:lastSynced?"Synced "+new Date(lastSynced).toLocaleString():"Synced"};
}
function paintSaveState(){
  const L=syncLabel();
  const el=document.getElementById("saveState"); if(el) el.textContent=L.text;
  const p=document.getElementById("syncPill"); if(!p) return;
  p.hidden=!L.pill; p.textContent=L.pill;
}

/* ---------- characters & towns UI ---------- */
function charsModal(){
  const live=liveChars(), arch=Object.entries(CH).filter(([,d])=>d.archived);
  modal(`<h2>Characters</h2>
    ${live.length?live.map(([id,d])=>`<button class="btn ${id===activeC?"pri":""}" data-a="switchChar" data-k="${id}"><strong>${esc(d.name||"Unnamed")}</strong> <span class="${id===activeC?"":"muted"} small">${esc([d.race,d.classes].filter(Boolean).join(", "))}</span></button>`).join(""):`<p class="muted">No characters yet.</p>`}
    <button class="btn" data-a="newChar" style="text-align:center">New character</button>
    ${S?`<button class="btn ghost" data-a="archiveChar" style="text-align:center">Archive ${esc(S.name||"this character")}</button>`:""}
    ${arch.length?`<h3 style="font-family:var(--display);margin:16px 0 4px">Archived</h3>${arch.map(([id,d])=>`<button class="btn ghost" data-a="restoreChar" data-k="${id}">${esc(d.name||"Unnamed")} <span class="muted small">Restore</span></button>`).join("")}`:""}`);
}
function newChar(name){
  const id=newId(); const d=clone(BLANK_CHAR); d.name=name||"New character"; d.updatedAt=Date.now();
  CH[id]=d; lastJ["c"+id]=docJ(d); persistDoc("c",id); setMeta("c",id,{rev:null,base:null,pending:true,owner:uid});
  activeC=id; activate(); persistIds(); render(); sync();
}
function newTown(name){
  const id=newId(); const d=clone(BLANK_TOWN); d.name=name||"New town"; d.updatedAt=Date.now();
  TW[id]=d; lastJ["t"+id]=docJ(d); persistDoc("t",id); setMeta("t",id,{rev:null,base:null,pending:true,owner:uid});
  activeT=id; activate(); persistIds(); render(); sync();
}
function renderNoChar(){
  return `<div class="grid"><section class="card" style="grid-column:1/-1"><h2>No character here yet</h2>
    ${session&&!firstSyncDone&&navigator.onLine?`<p class="muted">Loading your characters…</p>`:""}
    <p class="muted">${session?"Start a new character, or restore an archived one from the Characters list.":"Sign in on the Sync tab to load your characters, or start a new one on this device."}</p>
    <div class="row"><button class="btn pri" data-a="newChar">New character</button>${session?"":`<button class="btn" data-a="tab" data-k="sync">Go to Sync</button>`}</div></section></div>`;
}
function renderTownBar(){
  const ids=Object.keys(TW);
  const role=activeT?townRole(activeT):"owner";
  const shared=activeT&&townOwner(activeT)&&uid&&townOwner(activeT)!==uid;
  return `<section class="card" style="margin-bottom:16px"><div class="row">
    ${ids.length?`<label class="small muted">Town <select class="in" data-a-change="switchTown" style="width:auto;min-width:180px">${ids.map(id=>`<option value="${id}" ${id===activeT?"selected":""}>${esc(TW[id].name||"Unnamed town")}</option>`).join("")}</select></label>`:""}
    ${shared?`<span class="tag on">Shared with you${role==="viewer"?" (view only)":""}</span>`:""}
    <button class="btn sm" data-a="newTown">New town</button>
    ${activeT&&role==="owner"&&session?`<button class="btn sm" data-a="townShare">Share</button>`:""}
    ${TOWN_ONLY?"":`<a class="btn sm" href="./town/" target="_blank" rel="noopener">Open town app</a>`}
  </div></section>`;
}
function shareModal(){
  const list=members[activeT]||[];
  modal(`<h2>Share ${esc(T.name||"this town")}</h2>
    <p class="muted small">Your GM needs an account in this app. They’ll find their user code on their Sync tab. Paste it here.</p>
    ${list.length?list.map(m=>`<div class="row" style="margin-bottom:6px"><code style="flex:1;font-size:13px;word-break:break-all">${esc(m.user_id)}</code><span class="tag on">${m.role==="editor"?"Can edit":"View only"}</span><button class="x" data-a="removeMember" data-k="${m.user_id}" aria-label="Remove">×</button></div>`).join(""):`<p class="muted">Not shared with anyone yet.</p>`}
    <label class="small muted">User code<input class="in" id="memCode" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" style="margin:2px 0 8px"></label>
    <label class="small muted">Access <select class="in" id="memRole" style="width:auto"><option value="editor">Can edit</option><option value="viewer">View only</option></select></label>
    <button class="btn pri" data-a="addMember" style="text-align:center">Add person</button>`);
}
async function addMember(){
  const code=document.getElementById("memCode").value.trim().toLowerCase(), role=document.getElementById("memRole").value;
  if(!/^[0-9a-f-]{36}$/.test(code)){ toast("That doesn’t look like a user code."); return; }
  if(code===uid){ toast("That’s your own code."); return; }
  if(anyPending()||getMeta("t",activeT).rev===null){ await sync(); }
  const {error}=await withTimeout(sb.from("town_members").insert({town_id:activeT,user_id:code,role}));
  if(error){ toast(error.code==="23503"?"No account with that code. Check it and try again.":error.code==="23505"?"They already have access.":"Couldn’t share: "+error.message,4500); return; }
  await loadMembers(); shareModal(); toast("Shared.");
}
async function removeMember(code){
  const {error}=await withTimeout(sb.from("town_members").delete().eq("town_id",activeT).eq("user_id",code));
  if(error){ toast("Couldn’t remove: "+error.message); return; }
  await loadMembers(); shareModal();
}

function renderSync(){
  const L=syncLabel();
  let acct;
  if(!CFG.url||!CFG.key){
    acct=`<p class="muted">Paste your Supabase project details.</p>
      <label class="small muted">Project URL<input class="in" id="cfgUrl" placeholder="https://xxxx.supabase.co" style="margin:2px 0 8px"></label>
      <label class="small muted">Publishable (anon) key<input class="in" id="cfgKey" style="margin:2px 0 8px"></label>
      <button class="btn pri" data-a="saveCfg">Save sync settings</button>`;
  } else if(!session){
    acct=`<p class="muted">Sign in with your app account.</p>
      <label class="small muted">Email<input class="in" id="authEmail" type="email" autocomplete="username" style="margin:2px 0 8px"></label>
      <label class="small muted">Password<input class="in" id="authPass" type="password" autocomplete="current-password" style="margin:2px 0 8px"></label>
      ${authErr?`<p class="neg small">${esc(authErr)}</p>`:""}
      <button class="btn pri" data-a="signIn">Sign in</button>`;
  } else {
    acct=`<p>Signed in as <strong>${esc(session.user.email||"you")}</strong></p>
      <div class="row"><button class="btn pri" data-a="resync">Sync now</button><button class="btn" data-a="changePw">Change password</button><button class="btn" data-a="signOut">Sign out</button></div>
      <h3>Your user code</h3><p class="muted small">Give this to someone who wants to share a town with you.</p>
      <div class="row"><code style="flex:1;word-break:break-all;font-size:14px">${esc(session.user.id)}</code><button class="btn sm" data-a="copyCode">Copy</button></div>`;
  }
  return `<div class="grid">
    <section class="card"><h2>Sync</h2><p class="small" id="saveState">${esc(L.text)}</p>${acct}
      ${CFG.url?`<details style="margin-top:14px"><summary class="muted small">Project settings</summary><p class="small muted" style="word-break:break-all">${esc(CFG.url)}</p><button class="btn sm" data-a="clearCfg">Use different project settings</button></details>`:""}
    </section>
    <section class="card"><h2>Backup</h2>
      <p class="muted small">${TOWN_ONLY?"Saves the open town to a file. Loading a backup adds it as a new town, so nothing gets overwritten.":"Saves the open character and town to a file. Loading a backup adds it as a new character, so nothing gets overwritten."}</p>
      <div class="row"><button class="btn" data-a="export" ${(TOWN_ONLY?T:S)?"":"disabled"}>Save backup file</button><label class="btn">Load backup<input type="file" accept=".json,application/json" id="importFile" hidden></label></div>
      ${installEvt?`<button class="btn pri" data-a="install" style="margin-top:12px">Install as an app</button>`:""}
    </section></div>`;
}

window.addEventListener("online",()=>{ toast("Back online. Syncing your changes."); paintSaveState(); sync(); });
window.addEventListener("offline",()=>{ paintSaveState(); toast("You’re offline. Keep playing: changes are saved on this device.",4000); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) check(); });
document.addEventListener("focusout",()=>{ setTimeout(()=>{ const a=document.activeElement; if(needsRender&&!(a&&a.closest&&a.closest("main")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){ needsRender=false; render(); } },0); });
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(tab==="sync") render(); });
setInterval(check,20000);

bootLocal(); initClient(); render(); paintSaveState(); setTimeout(()=>sync(),300);
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
  // sw.js tells us when it downloaded a newer copy of the app than the one on screen
  navigator.serviceWorker.addEventListener("message",e=>{ if(e.data&&e.data.type==="update") document.getElementById("updPill").hidden=false; });
}
</script>
